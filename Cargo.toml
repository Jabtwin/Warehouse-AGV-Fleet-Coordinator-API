[package]
name = "agv_coordinator"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
autometrics = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "pathfinding_benchmark"
harness = false
